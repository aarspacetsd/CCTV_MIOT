# docker-compose.dev.yml
x-env: &default-env
  TZ: "Asia/Jakarta"

networks:
  laravel_net:
    driver: bridge

volumes:
  db_data:
  emqx_data:
  emqx_log:
  minio_data:
  storage_data:
  vendor_data:
  build_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile        # ← pakai Dockerfile root (multi-stage dengan Vite)
      target: app                   # ← pakai stage "app" (production stage)
    container_name: laravel_CCTV_app_dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8080:8080"                 # Laravel Reverb (WebSocket)
    environment:
      <<: *default-env
      APP_ENV: local
      APP_DEBUG: "true"
      PHP_OPCACHE_ENABLE: "0"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8080"
      VITE_REVERB_HOST: "localhost"
      VITE_REVERB_PORT: "8080"
      VITE_REVERB_SCHEME: "http"
    volumes:
      - ./:/app                     # mount source code
      - vendor_data:/app/vendor     # persist vendor dari Docker build
      - build_data:/app/public/build # persist public/build dari Docker build
      - storage_data:/app/storage   # persistent storage
    networks:
      - laravel_net

  db:
    image: mysql:8.0
    container_name: laravel_CCTV_db_dev
    hostname: db
    restart: unless-stopped
    environment:
      <<: *default-env
      MYSQL_DATABASE: Sistem_Camera_MIOT
      MYSQL_ROOT_PASSWORD: root
    command: >
      mysqld --default-authentication-plugin=mysql_native_password
             --character-set-server=utf8mb4
             --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: laravel_CCTV_phpmyadmin_dev
    restart: unless-stopped
    depends_on:
      - db
    environment:
      <<: *default-env
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    networks:
      - laravel_net

  emqx:
    image: emqx/emqx:latest
    container_name: laravel_CCTV_emqx_dev
    restart: unless-stopped
    environment:
      <<: *default-env
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin123
      EMQX_API__AUTHORIZATION__ENABLE: "true"
      EMQX_ALLOW_ANONYMOUS: "false"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - laravel_net

  minio:
    image: minio/minio:latest
    container_name: laravel_CCTV_minio_dev
    restart: unless-stopped
    environment:
      <<: *default-env
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - laravel_net
